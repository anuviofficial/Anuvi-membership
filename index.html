<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ANUVI Couture Membership</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f8f5ef;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      letter-spacing: 4px;
      color: #b08d35;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #222;
    }

    .card p {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #b08d35;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #b08d35;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #96762c;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .membership-card {
      display: none;
      margin-top: 22px;
      border-radius: 18px;
      padding: 24px;
      background: linear-gradient(135deg, #1f1f1f, #393939);
      color: white;
    }

    .membership-card h3 {
      color: #d7b75c;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    .info {
      margin-bottom: 14px;
    }

    .info span {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 3px;
    }

    .info strong {
      font-size: 16px;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 12px;
      border-radius: 20px;
      background: #d7b75c;
      color: #222;
      font-size: 12px;
      font-weight: bold;
    }

    .error {
      display: none;
      margin-top: 15px;
      text-align: center;
      color: #b00020;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ANUVI
    </div>

    <div class="subtitle">
      ANUVI Couture Digital Membership
    </div>

    <div class="card">

      <h2>Member Login</h2>

      <p>
        Enter your mobile number to view your membership details.
      </p>

      <label for="mobile">
        Mobile Number
      </label>

      <input
        type="tel"
        id="mobile"
        maxlength="10"
        inputmode="numeric"
        placeholder="Enter 10-digit mobile number"
      >

      <button id="checkButton" onclick="showMember()">
        Check Membership
      </button>

      <div class="error" id="errorMessage"></div>

      <div class="membership-card" id="membershipCard">

        <h3>
          ANUVI COUTURE
        </h3>

        <div class="info">
          <span>MEMBERSHIP ID</span>
          <strong id="showId"></strong>
        </div>

        <div class="info">
          <span>MEMBERSHIP STATUS</span>
          <strong id="showStatus"></strong>
        </div>

        <div class="info">
          <span>VALID TILL</span>
          <strong id="showValidTill"></strong>
        </div>

        <div class="info">
          <span>MEMBER SINCE</span>
          <strong id="showCreatedOn"></strong>
        </div>

        <div class="status">
          ANUVI MEMBER
        </div>

      </div>

    </div>

    <div class="footer">
      © ANUVI Couture
    </div>

  </div>


  <script>

    // ==============================
    // SUPABASE CONNECTION
    // ==============================

    const SUPABASE_URL =
      "https://vwcabveqbupgomtxbank.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ptUS0rXG84wr7A-53970aA_Y328CYJj";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // CHECK MEMBERSHIP
    // ==============================

    async function showMember() {

      const mobileInput =
        document.getElementById("mobile");

      const button =
        document.getElementById("checkButton");

      const membershipCard =
        document.getElementById("membershipCard");

      const errorMessage =
        document.getElementById("errorMessage");


      const mobile =
        mobileInput.value.trim();


      // Hide previous result
      membershipCard.style.display = "none";
      errorMessage.style.display = "none";


      // Check mobile number
      if (!/^[0-9]{10}$/.test(mobile)) {

        errorMessage.innerText =
          "Please enter a valid 10-digit mobile number.";

        errorMessage.style.display = "block";

        return;
      }


      button.disabled = true;
      button.innerText = "Checking...";


      try {

        // ==============================
        // CALL SUPABASE FUNCTION
        // ==============================

        const { data, error } =
          await supabaseClient.rpc(
            "get_membership_by_mobile",
            {
              p_mobile: mobile
            }
          );


        console.log("Supabase response:", data);


        if (error) {

          console.error("Supabase error:", error);

          errorMessage.innerText =
            "Unable to check membership. Please try again.";

          errorMessage.style.display = "block";

          return;
        }


        // No membership found
        if (!data || data.length === 0) {

          errorMessage.innerText =
            "No membership found for this mobile number.";

          errorMessage.style.display = "block";

          return;
        }


        const member = data[0];


        // ==============================
        // SHOW MEMBERSHIP DETAILS
        // ==============================

        document.getElementById("showId").innerText =
          member.membership_id || "Not available";


        document.getElementById("showStatus").innerText =
          member.membership_status || "Not available";


        document.getElementById("showValidTill").innerText =
          formatDate(member.valid_till);


        document.getElementById("showCreatedOn").innerText =
          formatDate(member.membership_created_on);


        membershipCard.style.display = "block";

      }

      catch (error) {

        console.error(error);

        errorMessage.innerText =
          "Something went wrong. Please try again.";

        errorMessage.style.display = "block";

      }

      finally {

        button.disabled = false;
        button.innerText = "Check Membership";

      }

    }


    // ==============================
    // DATE FORMAT
    // ==============================

    function formatDate(dateString) {

      if (!dateString) {
        return "Not available";
      }

      const date =
        new Date(dateString + "T00:00:00");

      return date.toLocaleDateString(
        "en-IN",
        {
          day: "2-digit",
          month: "short",
          year: "numeric"
        }
      );

    }

  </script>

</body>

</html>
