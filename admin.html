<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANUVI Couture - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:#f7f3ed;
  padding:30px 15px;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:30px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  letter-spacing:5px;
  color:#b58b2a;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-top:5px;
  margin-bottom:30px;
}

h2{
  text-align:center;
  color:#222;
  margin:10px 0 25px;
}

label{
  display:block;
  margin-top:16px;
  margin-bottom:7px;
  font-weight:600;
  color:#333;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#b58b2a;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  margin-top:22px;
  border:none;
  border-radius:9px;
  background:#b58b2a;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#96721f;
}

.logout{
  background:#333;
}

.logout:hover{
  background:#111;
}

.hidden{
  display:none;
}

.message{
  margin-top:18px;
  padding:13px;
  border-radius:8px;
  text-align:center;
  font-weight:600;
}

.success{
  background:#e8f7ed;
  color:#23733d;
}

.error{
  background:#fdecec;
  color:#a52828;
}

.info{
  background:#eef5ff;
  color:#24558a;
}

.customer-info{
  margin-top:15px;
  padding:15px;
  background:#faf7f0;
  border:1px solid #e5d7b5;
  border-radius:10px;
  line-height:1.8;
}

.membership-result{
  margin-top:15px;
  padding:20px;
  background:#faf7f0;
  border:1px solid #e5d7b5;
  border-radius:12px;
  text-align:center;
}

.membership-id{
  font-size:28px;
  font-weight:bold;
  color:#b58b2a;
  margin:10px 0;
}

.purchase-card{
  margin-top:15px;
  padding:18px;
  background:#faf7f0;
  border:1px solid #e5d7b5;
  border-radius:12px;
  line-height:1.8;
}

.auto-amount{
  background:#faf7f0;
  border:2px solid #b58b2a;
  font-weight:bold;
}

.divider{
  border:0;
  border-top:2px solid #eee;
  margin:40px 0;
}

.small{
  text-align:center;
  font-size:13px;
  color:#777;
  margin-top:10px;
}

@media(max-width:600px){

  body{
    padding:15px 10px;
  }

  .card{
    padding:20px 16px;
  }

  .logo{
    font-size:28px;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- ==================================================
     LOGIN
================================================== -->

<div class="card" id="loginSection">

  <div class="logo">ANUVI</div>

  <div class="subtitle">
    Couture
  </div>

  <h2>Admin Login</h2>

  <label for="loginEmail">
    Admin Email
  </label>

  <input
    type="email"
    id="loginEmail"
    placeholder="Enter admin email"
    autocomplete="username"
  >

  <label for="loginPassword">
    Password
  </label>

  <input
    type="password"
    id="loginPassword"
    placeholder="Enter password"
    autocomplete="current-password"
  >

  <button onclick="loginAdmin()">
    Login
  </button>

  <div id="loginMessage"></div>

</div>


<!-- ==================================================
     ADMIN DASHBOARD
================================================== -->

<div class="card hidden" id="adminSection">

  <div class="logo">ANUVI</div>

  <div class="subtitle">
    Couture Admin Panel
  </div>


  <!-- ==================================================
       CREATE MEMBERSHIP
  ================================================== -->

  <h2>Create New Membership</h2>

  <label for="customerName">
    Customer Name
  </label>

  <input
    type="text"
    id="customerName"
    placeholder="Enter customer name"
  >


  <label for="customerMobile">
    Mobile Number
  </label>

  <input
    type="tel"
    id="customerMobile"
    maxlength="10"
    inputmode="numeric"
    placeholder="Enter 10 digit mobile number"
  >


  <label for="customerEmail">
    Email
  </label>

  <input
    type="email"
    id="customerEmail"
    placeholder="Enter customer email"
  >


  <button onclick="createMembership()">
    Create Membership
  </button>

  <div id="membershipMessage"></div>


  <hr class="divider">


  <!-- ==================================================
       ADD PURCHASE
  ================================================== -->

  <h2>Add Purchase</h2>

  <label for="purchaseMobile">
    Customer Mobile Number
  </label>

  <input
    type="tel"
    id="purchaseMobile"
    maxlength="10"
    inputmode="numeric"
    placeholder="Enter 10 digit mobile number"
    onblur="findCustomer()"
  >

  <div id="customerInfo"></div>


  <label for="purchaseDate">
    Purchase Date
  </label>

  <input
    type="date"
    id="purchaseDate"
  >


  <label for="invoiceNumber">
    Invoice / Bill Number
  </label>

  <input
    type="text"
    id="invoiceNumber"
    placeholder="Example: INV001"
  >


  <label for="productName">
    Product Name
  </label>

  <input
    type="text"
    id="productName"
    placeholder="Example: Floral Dress"
  >


  <label for="category">
    Product Category
  </label>

  <select id="category">

    <option value="">
      Select Category
    </option>

    <option value="Dress">
      Dress
    </option>

    <option value="Kurti">
      Kurti
    </option>

    <option value="Co-ord Set">
      Co-ord Set
    </option>

    <option value="Top">
      Top
    </option>

    <option value="Skirt">
      Skirt
    </option>

    <option value="Jewellery">
      Jewellery
    </option>

    <option value="Accessories">
      Accessories
    </option>

    <option value="Other">
      Other
    </option>

  </select>


  <label for="quantity">
    Quantity
  </label>

  <input
    type="number"
    id="quantity"
    min="1"
    value="1"
  >


  <label for="originalPrice">
    Original Price / Cost
  </label>

  <input
    type="number"
    id="originalPrice"
    min="0"
    step="0.01"
    placeholder="Example: 1500"
    oninput="calculateFinalAmount()"
  >


  <label for="discount">
    Discount
  </label>

  <input
    type="number"
    id="discount"
    min="0"
    step="0.01"
    value="0"
    placeholder="Example: 200"
    oninput="calculateFinalAmount()"
  >


  <label for="finalAmount">
    Final Amount
  </label>

  <input
    type="number"
    id="finalAmount"
    class="auto-amount"
    readonly
    placeholder="Automatically calculated"
  >

  <div class="small">
    Final Amount = Original Price − Discount
  </div>


  <label for="paymentMethod">
    Payment Method
  </label>

  <select id="paymentMethod">

    <option value="Cash">
      Cash
    </option>

    <option value="UPI">
      UPI
    </option>

    <option value="Card">
      Card
    </option>

    <option value="Other">
      Other
    </option>

  </select>


  <label for="salesPerson">
    Sales Person / Staff
  </label>

  <input
    type="text"
    id="salesPerson"
    placeholder="Enter staff name"
  >


  <label for="notes">
    Notes
  </label>

  <textarea
    id="notes"
    placeholder="Any additional notes..."
  ></textarea>


  <button onclick="addPurchase()">
    Add Purchase
  </button>

  <div id="purchaseMessage"></div>


  <hr class="divider">


  <!-- ==================================================
       PURCHASE HISTORY
  ================================================== -->

  <h2>Purchase History</h2>

  <label for="historyMobile">
    Search by Mobile Number
  </label>

  <input
    type="tel"
    id="historyMobile"
    maxlength="10"
    inputmode="numeric"
    placeholder="Enter 10 digit mobile number"
  >

  <button onclick="loadPurchaseHistory()">
    Search Purchase History
  </button>

  <div id="purchaseHistory"></div>


  <button
    class="logout"
    onclick="logoutAdmin()"
  >
    Logout
  </button>

</div>

</div>


<script>

/* ==================================================
   SUPABASE CONFIGURATION
================================================== */

/*
  IMPORTANT:

  SUPABASE_URL ko change mat karna.

  SUPABASE_KEY mein apni Supabase
  PUBLISHABLE KEY paste karna.

  Service Role / Secret Key yahan MAT daalna.
*/

const SUPABASE_URL =
  "https://vwcabveqbupgomtxbank.supabase.co";

const SUPABASE_KEY =
sb_publishable_ptUS0rXG84wr7A-53970aA_Y328CYJj

/* ==================================================
   SUPABASE CLIENT
================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   ADMIN EMAIL
================================================== */

const ADMIN_EMAIL =
  "anuvioffice@gmail.com";


/* ==================================================
   LOGIN
================================================== */

async function loginAdmin(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document
      .getElementById("loginMessage");

  message.innerHTML = "";


  if(!email || !password){

    showError(
      message,
      "Please enter email and password."
    );

    return;
  }


  if(email.toLowerCase() !== ADMIN_EMAIL){

    showError(
      message,
      "This email is not authorized for admin access."
    );

    return;
  }


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(error){

    showError(
      message,
      error.message
    );

    return;
  }


  if(
    !data ||
    !data.user ||
    data.user.email.toLowerCase() !== ADMIN_EMAIL
  ){

    await supabaseClient.auth.signOut();

    showError(
      message,
      "Admin access denied."
    );

    return;
  }


  document
    .getElementById("loginSection")
    .classList.add("hidden");

  document
    .getElementById("adminSection")
    .classList.remove("hidden");

  setTodayDate();
}


/* ==================================================
   CREATE MEMBERSHIP
================================================== */

async function createMembership(){

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();

  const mobile =
    document
      .getElementById("customerMobile")
      .value
      .trim();

  const email =
    document
      .getElementById("customerEmail")
      .value
      .trim();

  const message =
    document
      .getElementById("membershipMessage");

  message.innerHTML = "";


  if(!name){

    showError(
      message,
      "Please enter customer name."
    );

    return;
  }


  if(!/^[0-9]{10}$/.test(mobile)){

    showError(
      message,
      "Please enter a valid 10 digit mobile number."
    );

    return;
  }


  if(!email){

    showError(
      message,
      "Please enter customer email."
    );

    return;
  }


  /* Check duplicate mobile */

  const {
    data:existingCustomer,
    error:existingError
  } =
    await supabaseClient
      .from("Customers")
      .select("Membership_id")
      .eq("Contact Number", mobile)
      .maybeSingle();


  if(existingError){

    showError(
      message,
      existingError.message
    );

    return;
  }


  if(existingCustomer){

    showError(
      message,
      "This mobile number already has membership: " +
      existingCustomer.Membership_id
    );

    return;
  }


  /* Get latest Membership ID */

  const {
    data:customers,
    error:fetchError
  } =
    await supabaseClient
      .from("Customers")
      .select("Membership_id")
      .order("Membership_id", {
        ascending:false
      })
      .limit(1);


  if(fetchError){

    showError(
      message,
      fetchError.message
    );

    return;
  }


  let nextNumber = 1;


  if(customers && customers.length > 0){

    const lastId =
      customers[0].Membership_id;

    const number =
      parseInt(
        String(lastId).replace("ANUVI",""),
        10
      );

    if(!isNaN(number)){
      nextNumber = number + 1;
    }
  }


  const membershipId =
    "ANUVI" +
    String(nextNumber).padStart(3,"0");


  const today =
    new Date();

  const validTill =
    new Date();

  validTill.setFullYear(
    validTill.getFullYear() + 1
  );


  const membershipDate =
    getLocalDate(today);

  const validTillDate =
    getLocalDate(validTill);


  /* Insert */

  const { error:insertError } =
    await supabaseClient
      .from("Customers")
      .insert([{

        Membership_id:
          membershipId,

        Customer_name:
          name,

        "Contact Number":
          mobile,

        Email:
          email,

        Membership_date:
          membershipDate,

        Membership_status:
          "Active"

      }]);


  if(insertError){

    showError(
      message,
      insertError.message
    );

    return;
  }


  message.innerHTML =

    '<div class="message success">' +

      'Membership created successfully!' +

      '<div class="membership-result">' +

        '<div>Membership ID</div>' +

        '<div class="membership-id">' +
          escapeHtml(membershipId) +
        '</div>' +

        '<div><strong>Customer:</strong> ' +
          escapeHtml(name) +
        '</div>' +

        '<div><strong>Mobile:</strong> ' +
          escapeHtml(mobile) +
        '</div>' +

        '<div><strong>Valid Till:</strong> ' +
          formatDate(validTillDate) +
        '</div>' +

      '</div>' +

    '</div>';


  document
    .getElementById("customerName")
    .value = "";

  document
    .getElementById("customerMobile")
    .value = "";

  document
    .getElementById("customerEmail")
    .value = "";
}


/* ==================================================
   FIND CUSTOMER BY MOBILE
================================================== */

async function findCustomer(){

  const mobile =
    document
      .getElementById("purchaseMobile")
      .value
      .trim();

  const info =
    document
      .getElementById("customerInfo");

  info.innerHTML = "";


  if(!mobile){
    return;
  }


  if(!/^[0-9]{10}$/.test(mobile)){

    showError(
      info,
      "Please enter a valid 10 digit mobile number."
    );

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("Customers")
      .select(
        "Membership_id, Customer_name"
      )
      .eq("Contact Number", mobile)
      .maybeSingle();


  if(error){

    showError(
      info,
      error.message
    );

    return;
  }


  if(!data){

    showError(
      info,
      "Customer not found. Please check mobile number."
    );

    return;
  }


  info.innerHTML =

    '<div class="customer-info">' +

      '<strong>Customer:</strong> ' +
      escapeHtml(data.Customer_name) +

      '<br>' +

      '<strong>Membership ID:</strong> ' +
      escapeHtml(data.Membership_id) +

    '</div>';
}


/* ==================================================
   AUTO FINAL AMOUNT
================================================== */

function calculateFinalAmount(){

  const originalPrice =
    parseFloat(
      document
        .getElementById("originalPrice")
        .value
    ) || 0;


  const discount =
    parseFloat(
      document
        .getElementById("discount")
        .value
    ) || 0;


  let finalAmount =
    originalPrice - discount;


  if(finalAmount < 0){
    finalAmount = 0;
  }


  document
    .getElementById("finalAmount")
    .value =
      finalAmount.toFixed(2);
}


/* ==================================================
   ADD PURCHASE
================================================== */

async function addPurchase(){

  const mobile =
    document
      .getElementById("purchaseMobile")
      .value
      .trim();

  const purchaseDate =
    document
      .getElementById("purchaseDate")
      .value;

  const invoiceNumber =
    document
      .getElementById("invoiceNumber")
      .value
      .trim();

  const productName =
    document
      .getElementById("productName")
      .value
      .trim();

  const category =
    document
      .getElementById("category")
      .value;

  const quantity =
    parseInt(
      document
        .getElementById("quantity")
        .value,
      10
    ) || 1;

  const originalPrice =
    parseFloat(
      document
        .getElementById("originalPrice")
        .value
    ) || 0;

  const discount =
    parseFloat(
      document
        .getElementById("discount")
        .value
    ) || 0;

  const finalAmount =
    Math.max(
      0,
      originalPrice - discount
    );

  const paymentMethod =
    document
      .getElementById("paymentMethod")
      .value;

  const salesPerson =
    document
      .getElementById("salesPerson")
      .value
      .trim();

  const notes =
    document
      .getElementById("notes")
      .value
      .trim();

  const message =
    document
      .getElementById("purchaseMessage");

  message.innerHTML = "";


  /* Validation */

  if(!/^[0-9]{10}$/.test(mobile)){

    showError(
      message,
      "Please enter a valid 10 digit mobile number."
    );

    return;
  }


  if(!purchaseDate){

    showError(
      message,
      "Please select purchase date."
    );

    return;
  }


  if(!productName){

    showError(
      message,
      "Please enter product name."
    );

    return;
  }


  if(quantity < 1){

    showError(
      message,
      "Quantity must be at least 1."
    );

    return;
  }


  if(originalPrice < 0){

    showError(
      message,
      "Original Price cannot be negative."
    );

    return;
  }


  if(discount < 0){

    showError(
      message,
      "Discount cannot be negative."
    );

    return;
  }


  if(discount > originalPrice){

    showError(
      message,
      "Discount cannot be greater than Original Price."
    );

    return;
  }


  /* Find customer */

  const {
    data:customer,
    error:customerError
  } =
    await supabaseClient
      .from("Customers")
      .select(
        "Membership_id, Customer_name"
      )
      .eq("Contact Number", mobile)
      .maybeSingle();


  if(customerError){

    showError(
      message,
      customerError.message
    );

    return;
  }


  if(!customer){

    showError(
      message,
      "Customer not found. Please check mobile number."
    );

    return;
  }


  /* Insert Purchase */

  const { error } =
    await supabaseClient
      .from("Purchases")
      .insert([{

        Membership_id:
          customer.Membership_id,

        Purchase_date:
          purchaseDate,

        Product_name:
          productName,

        Quantity:
          quantity,

        Amount:
          finalAmount,

        Payment_method:
          paymentMethod,

        Invoice_number:
          invoiceNumber || null,

        Category:
          category || null,

        Original_price:
          originalPrice,

        Discount:
          discount,

        Sales_person:
          salesPerson || null,

        Notes:
          notes || null

      }]);


  if(error){

    showError(
      message,
      error.message
    );

    return;
  }


  message.innerHTML =

    '<div class="message success">' +

      'Purchase added successfully ✓' +

      '<br>' +

      'Final Amount: ₹' +
      finalAmount.toFixed(2) +

    '</div>';


  clearPurchaseForm();
}


/* ==================================================
   PURCHASE HISTORY
================================================== */

async function loadPurchaseHistory(){

  const mobile =
    document
      .getElementById("historyMobile")
      .value
      .trim();

  const history =
    document
      .getElementById("purchaseHistory");

  history.innerHTML = "";


  if(!/^[0-9]{10}$/.test(mobile)){

    showError(
      history,
      "Please enter a valid 10 digit mobile number."
    );

    return;
  }


  /* Find Customer */

  const {
    data:customer,
    error:customerError
  } =
    await supabaseClient
      .from("Customers")
      .select(
        "Membership_id, Customer_name"
      )
      .eq("Contact Number", mobile)
      .maybeSingle();


  if(customerError){

    showError(
      history,
      customerError.message
    );

    return;
  }


  if(!customer){

    showError(
      history,
      "Customer not found."
    );

    return;
  }


  /* Get purchases */

  const {
    data:purchases,
    error
  } =
    await supabaseClient
      .from("Purchases")
      .select("*")
      .eq(
        "Membership_id",
        customer.Membership_id
      )
      .order(
        "Purchase_date",
        {
          ascending:false
        }
      );


  if(error){

    showError(
      history,
      error.message
    );

    return;
  }


  let html =

    '<div class="customer-info">' +

      '<strong>Customer:</strong> ' +
      escapeHtml(customer.Customer_name) +

      '<br>' +

      '<strong>Membership ID:</strong> ' +
      escapeHtml(customer.Membership_id) +

    '</div>';


  if(!purchases || purchases.length === 0){

    html +=

      '<div class="message info">' +
      'No purchase history found.' +
      '</div>';

    history.innerHTML = html;

    return;
  }


  purchases.forEach(function(purchase){

    html +=

      '<div class="purchase-card">' +

        '<strong>Date:</strong> ' +
        formatDate(
          purchase.Purchase_date
        ) +

        '<br>' +

        '<strong>Product:</strong> ' +
        escapeHtml(
          purchase.Product_name || "-"
        ) +

        '<br>' +

        '<strong>Category:</strong> ' +
        escapeHtml(
          purchase.Category || "-"
        ) +

        '<br>' +

        '<strong>Quantity:</strong> ' +
        (purchase.Quantity || 0) +

        '<br>' +

        '<strong>Original Price / Cost:</strong> ₹' +
        Number(
          purchase.Original_price || 0
        ).toFixed(2) +

        '<br>' +

        '<strong>Discount:</strong> ₹' +
        Number(
          purchase.Discount || 0
        ).toFixed(2) +

        '<br>' +

        '<strong>Final Amount:</strong> ₹' +
        Number(
          purchase.Amount || 0
        ).toFixed(2) +

        '<br>' +

        '<strong>Payment:</strong> ' +
        escapeHtml(
          purchase.Payment_method || "-"
        ) +

        '<br>' +

        '<strong>Invoice:</strong> ' +
        escapeHtml(
          purchase.Invoice_number || "-"
        ) +

        '<br>' +

        '<strong>Sales Person:</strong> ' +
        escapeHtml(
          purchase.Sales_person || "-"
        ) +

        '<br>' +

        '<strong>Notes:</strong> ' +
        escapeHtml(
          purchase.Notes || "-"
        ) +

      '</div>';

  });


  history.innerHTML = html;
}

/* ==================================================
   CHECK EXISTING SESSION
================================================== */

async function checkLogin(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if(error){
    return;
  }


  if(
    data &&
    data.session &&
    data.session.user &&
    data.session.user.email &&
    data.session.user.email.toLowerCase() === ADMIN_EMAIL
  ){

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminSection")
      .classList.remove("hidden");

    setTodayDate();

  }else{

    if(data && data.session){

      await supabaseClient.auth.signOut();

    }

  }
}


/* ==================================================
   TODAY DATE
================================================== */

function setTodayDate(){

  const today =
    new Date();

  document
    .getElementById("purchaseDate")
    .value =
      getLocalDate(today);
}


/* ==================================================
   LOCAL DATE
================================================== */

function getLocalDate(date){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );
}


/* ==================================================
   DATE DISPLAY
================================================== */

function formatDate(dateString){

  if(!dateString){
    return "-";
  }

  const parts =
    String(dateString).split("-");

  if(parts.length !== 3){
    return dateString;
  }

  const months = [
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"
  ];

  const monthIndex =
    parseInt(parts[1],10) - 1;

  return (
    parts[2] +
    " " +
    (months[monthIndex] || parts[1]) +
    " " +
    parts[0]
  );
}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ==================================================
   ERROR MESSAGE
================================================== */

function showError(element,message){

  element.innerHTML =
    '<div class="message error">' +
    escapeHtml(message) +
    '</div>';
}
